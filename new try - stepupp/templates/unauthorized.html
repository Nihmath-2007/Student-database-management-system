{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fa-solid fa-lock fa-4x text-danger mb-3"></i>
    <h1 class="h2 fw-bold text-navy">403 - Access Denied</h1>

</div>
{% endblock %}
