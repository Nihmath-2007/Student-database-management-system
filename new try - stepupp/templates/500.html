{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="fa-solid fa-bug fa-4x text-danger mb-3"></i>
    <h1 class="h2 fw-bold text-navy">500 - Server Error</h1>
    <p class="text-muted">An internal application error occurred while processing your request.</p>
    {% if error %}
        <div class="alert alert-danger mx-auto mt-3" style="max-width: 600px;"><code>{{ error }}</code></div>
    {% endif %}
    <a href="/" class="btn btn-msec mt-2"><i class="fa-solid fa-house me-2"></i> Return to Safety</a>
</div>
{% endblock %}
